<body>
  <header class="header">
    <a href="#" class="logo">CHARMIX</a>

    <nav class="nav">

      <a href="event.html">EVENT</a>
      <a class="js-contact" href="mailto:spmdrk0118@gmail.com">CONTACT</a>

  <footer class="footer">
